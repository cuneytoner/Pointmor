name: Deploy Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Run demo seed after deploy"
        required: false
        default: "false"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pointmor-api:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/pointmor-api:demo-latest

      - name: Build and push Admin Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/admin-web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pointmor-admin-web:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/pointmor-admin-web:demo-latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEMO_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEMO_HOST }} >> ~/.ssh/known_hosts

      - name: Upload project infra
        run: |
          rsync -avz infra/ ${{ secrets.DEMO_USER }}@${{ secrets.DEMO_HOST }}:/opt/pointmor-demo/infra/

      - name: Write demo env file
        run: |
          ssh ${{ secrets.DEMO_USER }}@${{ secrets.DEMO_HOST }} "cat > /opt/pointmor-demo/infra/docker/.env.demo" <<'ENVEOF'
          ${{ secrets.DEMO_ENV_FILE }}
          ENVEOF

      - name: Deploy containers
        run: |
          ssh ${{ secrets.DEMO_USER }}@${{ secrets.DEMO_HOST }} \
            "cd /opt/pointmor-demo && \
             export API_IMAGE=ghcr.io/${{ github.repository_owner }}/pointmor-api:${{ needs.build-and-push.outputs.image_tag }} && \
             export WEB_IMAGE=ghcr.io/${{ github.repository_owner }}/pointmor-admin-web:${{ needs.build-and-push.outputs.image_tag }} && \
             bash infra/scripts/deploy-demo.sh"

      - name: Run migrations
        run: |
          ssh ${{ secrets.DEMO_USER }}@${{ secrets.DEMO_HOST }} \
            "cd /opt/pointmor-demo && bash infra/scripts/migrate-demo.sh"

      - name: Run seed if requested
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_seed == 'true' }}
        run: |
          ssh ${{ secrets.DEMO_USER }}@${{ secrets.DEMO_HOST }} \
            "cd /opt/pointmor-demo && bash infra/scripts/seed-demo.sh"

      - name: Health check
        run: |
          ssh ${{ secrets.DEMO_USER }}@${{ secrets.DEMO_HOST }} \
            "cd /opt/pointmor-demo && bash infra/scripts/healthcheck-demo.sh"
