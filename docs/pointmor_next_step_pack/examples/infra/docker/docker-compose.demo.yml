version: "3.9"

services:
  postgres-demo:
    image: postgres:16-alpine
    container_name: pointmor-postgres-demo
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pointmor_demo}
      POSTGRES_USER: ${POSTGRES_USER:-pointmor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pointmor_demo_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pointmor-demo-net

  api-demo:
    image: ${API_IMAGE:-ghcr.io/example/pointmor-api:demo-latest}
    container_name: pointmor-api-demo
    restart: unless-stopped
    depends_on:
      postgres-demo:
        condition: service_healthy
    env_file:
      - ./.env.demo
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-pointmor}:${POSTGRES_PASSWORD}@postgres-demo:5432/${POSTGRES_DB:-pointmor_demo}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECRET: ${COOKIE_SECRET}
      CUSTOMER_PORTAL_JWT_SECRET: ${CUSTOMER_PORTAL_JWT_SECRET}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - pointmor-demo-net

  admin-web-demo:
    image: ${WEB_IMAGE:-ghcr.io/example/pointmor-admin-web:demo-latest}
    container_name: pointmor-admin-web-demo
    restart: unless-stopped
    depends_on:
      api-demo:
        condition: service_healthy
    env_file:
      - ./.env.demo
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    expose:
      - "8080"
    networks:
      - pointmor-demo-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pointmor-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - admin-web-demo
      - api-demo
    networks:
      - pointmor-demo-net

networks:
  pointmor-demo-net:
    driver: bridge

volumes:
  pointmor_demo_pgdata:
