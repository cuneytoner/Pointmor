name: Deploy Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Run demo seed after deploy"
        required: false
        default: "false"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pointmor-api:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/pointmor-api:demo-latest

      - name: Build and push Admin Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pointmor-admin-web:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/pointmor-admin-web:demo-latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}

      - name: Copy deploy files to server
        run: |
          rsync -az --delete \
            infra/docker/docker-compose.demo.yml \
            infra/scripts/ \
            ${{ secrets.DEMO_SSH_USER }}@${{ secrets.DEMO_HOST }}:/opt/pointmor-demo/

      - name: Write remote env file
        run: |
          ssh ${{ secrets.DEMO_SSH_USER }}@${{ secrets.DEMO_HOST }} "cat > /opt/pointmor-demo/.env.demo <<'ENVEOF'
          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
          POSTGRES_DB=${{ secrets.DEMO_POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.DEMO_POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.DEMO_POSTGRES_PASSWORD }}
          COOKIE_SECRET=${{ secrets.DEMO_COOKIE_SECRET }}
          CUSTOMER_PORTAL_JWT_SECRET=${{ secrets.DEMO_CUSTOMER_PORTAL_JWT_SECRET }}
          CORS_ORIGINS=${{ secrets.DEMO_CORS_ORIGINS }}
          RATE_LIMIT_MAX=${{ secrets.DEMO_RATE_LIMIT_MAX }}
          RATE_LIMIT_TIME_WINDOW=${{ secrets.DEMO_RATE_LIMIT_TIME_WINDOW }}
          WEBHOOK_SECRET=${{ secrets.DEMO_WEBHOOK_SECRET }}
          VITE_API_BASE_URL=${{ secrets.DEMO_VITE_API_BASE_URL }}
          CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          ENVEOF"

      - name: Deploy on remote host
        run: |
          ssh ${{ secrets.DEMO_SSH_USER }}@${{ secrets.DEMO_HOST }} \
            'cd /opt/pointmor-demo && chmod +x infra/scripts/*.sh && ./infra/scripts/deploy-demo.sh'

      - name: Run migrations
        run: |
          ssh ${{ secrets.DEMO_SSH_USER }}@${{ secrets.DEMO_HOST }} \
            'cd /opt/pointmor-demo && ./infra/scripts/migrate-demo.sh'

      - name: Run optional demo seed
        if: ${{ github.event.inputs.run_seed == 'true' }}
        run: |
          ssh ${{ secrets.DEMO_SSH_USER }}@${{ secrets.DEMO_HOST }} \
            'cd /opt/pointmor-demo && ./infra/scripts/seed-demo.sh'

      - name: Health check
        run: |
          ssh ${{ secrets.DEMO_SSH_USER }}@${{ secrets.DEMO_HOST }} \
            'cd /opt/pointmor-demo && ./infra/scripts/healthcheck-demo.sh'
