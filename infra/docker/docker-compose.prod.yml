name: pointmor-prod

services:
  api-prod:
    image: ${POINTMOR_API_IMAGE}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      COOKIE_SECRET: ${COOKIE_SECRET}
      CUSTOMER_PORTAL_JWT_SECRET: ${CUSTOMER_PORTAL_JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-false}
      ENABLE_HSTS: ${ENABLE_HSTS:-true}
      CUSTOMER_SESSION_MODE: ${CUSTOMER_SESSION_MODE:-cookie}
      CUSTOMER_ALLOW_BEARER_FALLBACK: ${CUSTOMER_ALLOW_BEARER_FALLBACK:-false}
      CUSTOMER_PORTAL_JTI_REQUIRED_AFTER: ${CUSTOMER_PORTAL_JTI_REQUIRED_AFTER:-}
      CUSTOMER_BEARER_LEGACY_SUNSET_AFTER: ${CUSTOMER_BEARER_LEGACY_SUNSET_AFTER:-}
      REDIS_URL: ${REDIS_URL}
      SECURITY_STATE_BACKEND: ${SECURITY_STATE_BACKEND:-redis}
      SECURITY_STATE_ALLOW_MEMORY_FALLBACK: ${SECURITY_STATE_ALLOW_MEMORY_FALLBACK:-false}
      SECURITY_STATE_ACK_IN_PROCESS_MEMORY: ${SECURITY_STATE_ACK_IN_PROCESS_MEMORY:-false}
      SECURITY_STATE_MEMORY_FALLBACK_JUSTIFICATION: ${SECURITY_STATE_MEMORY_FALLBACK_JUSTIFICATION:-}
      SECURITY_STATE_MEMORY_FALLBACK_EXPIRES_AT: ${SECURITY_STATE_MEMORY_FALLBACK_EXPIRES_AT:-}
      SECURITY_STATE_REDIS_UNAVAILABLE_REPLAY: ${SECURITY_STATE_REDIS_UNAVAILABLE_REPLAY:-closed}
      SECURITY_STATE_REDIS_UNAVAILABLE_REVOKE_READ: ${SECURITY_STATE_REDIS_UNAVAILABLE_REVOKE_READ:-closed}
      ALLOW_HEALTH_SECURITY_SUMMARY: ${ALLOW_HEALTH_SECURITY_SUMMARY:-true}
      POINTMOR_PREFLIGHT_SECRET: ${POINTMOR_PREFLIGHT_SECRET}
      POINTMOR_PREFLIGHT_ALLOW_QUERY: ${POINTMOR_PREFLIGHT_ALLOW_QUERY:-false}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET}
      WEBHOOK_AUTH_MODE: ${WEBHOOK_AUTH_MODE:-hmac}
      WEBHOOK_ALLOW_LEGACY_SECRET: ${WEBHOOK_ALLOW_LEGACY_SECRET:-false}
      WEBHOOK_TIMESTAMP_SKEW_SEC: ${WEBHOOK_TIMESTAMP_SKEW_SEC:-300}
      RETENTION_JOB_SECRET: ${RETENTION_JOB_SECRET:-}
      HQ_INSIGHT_JOB_SECRET: ${HQ_INSIGHT_JOB_SECRET:-}
      INTERNAL_JOB_LEGACY_AUTH_EXPIRES_AT: ${INTERNAL_JOB_LEGACY_AUTH_EXPIRES_AT:-}
      INTERNAL_JOB_REQUIRE_HMAC: ${INTERNAL_JOB_REQUIRE_HMAC:-true}
      INTERNAL_JOB_REQUIRE_TIMESTAMP: ${INTERNAL_JOB_REQUIRE_TIMESTAMP:-true}
      INTERNAL_JOB_TIMESTAMP_SKEW_SEC: ${INTERNAL_JOB_TIMESTAMP_SKEW_SEC:-300}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-400}
      PUBLIC_API_RATE_MAX: ${PUBLIC_API_RATE_MAX:-120}
      PUBLIC_LOYALTY_RATE_MAX: ${PUBLIC_LOYALTY_RATE_MAX:-60}
      PUBLIC_SESSION_RATE_MAX: ${PUBLIC_SESSION_RATE_MAX:-20}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  admin-web-prod:
    image: ${POINTMOR_ADMIN_IMAGE}
    restart: unless-stopped
    depends_on:
      api-prod:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

