# Pointmor pre-alpha demo stack — repo kökünden:
# docker compose -f infra/docker/docker-compose.demo.yml --env-file infra/docker/.env.demo up -d
# Ayrı volume: postgres_demo_data (dev DB ile karışmaz).

name: pointmor-demo

services:
  postgres-demo:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_DEMO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DEMO_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DEMO_DB}
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_DEMO_PORT:-55432}:5432"
    networks: [demo]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-demo:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: [redis]
    networks: [demo]

  api-demo:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: demo
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL_DEMO}
      COOKIE_SECRET: ${COOKIE_SECRET}
      CUSTOMER_PORTAL_JWT_SECRET: ${CUSTOMER_PORTAL_JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
      ENABLE_HSTS: ${ENABLE_HSTS:-}
      CUSTOMER_SESSION_MODE: ${CUSTOMER_SESSION_MODE:-cookie}
      WEBHOOK_AUTH_MODE: ${WEBHOOK_AUTH_MODE:-hmac}
      REDIS_URL: ${REDIS_URL:-}
      SECURITY_STATE_BACKEND: ${SECURITY_STATE_BACKEND:-auto}
      SECURITY_STATE_ALLOW_MEMORY_FALLBACK: ${SECURITY_STATE_ALLOW_MEMORY_FALLBACK:-false}
      SECURITY_STATE_ACK_IN_PROCESS_MEMORY: ${SECURITY_STATE_ACK_IN_PROCESS_MEMORY:-false}
      SECURITY_STATE_MEMORY_FALLBACK_JUSTIFICATION: ${SECURITY_STATE_MEMORY_FALLBACK_JUSTIFICATION:-}
      SECURITY_STATE_MEMORY_FALLBACK_EXPIRES_AT: ${SECURITY_STATE_MEMORY_FALLBACK_EXPIRES_AT:-2026-11-15T00:00:00.000Z}
      SECURITY_STATE_REDIS_UNAVAILABLE: ${SECURITY_STATE_REDIS_UNAVAILABLE:-closed}
      SECURITY_STATE_REDIS_UNAVAILABLE_REPLAY: ${SECURITY_STATE_REDIS_UNAVAILABLE_REPLAY:-closed}
      SECURITY_STATE_REDIS_UNAVAILABLE_REVOKE_READ: ${SECURITY_STATE_REDIS_UNAVAILABLE_REVOKE_READ:-closed}
      CUSTOMER_ALLOW_BEARER_FALLBACK: ${CUSTOMER_ALLOW_BEARER_FALLBACK:-false}
      CUSTOMER_PORTAL_JTI_REQUIRED_AFTER: ${CUSTOMER_PORTAL_JTI_REQUIRED_AFTER:-2026-10-01T00:00:00.000Z}
      CUSTOMER_BEARER_LEGACY_SUNSET_AFTER: ${CUSTOMER_BEARER_LEGACY_SUNSET_AFTER:-2026-10-15T00:00:00.000Z}
      ALLOW_HEALTH_SECURITY_SUMMARY: ${ALLOW_HEALTH_SECURITY_SUMMARY:-false}
      POINTMOR_PREFLIGHT_SECRET: ${POINTMOR_PREFLIGHT_SECRET:-}
      POINTMOR_PREFLIGHT_ALLOW_QUERY: ${POINTMOR_PREFLIGHT_ALLOW_QUERY:-false}
      INTERNAL_JOB_LEGACY_AUTH_ACKNOWLEDGED: ${INTERNAL_JOB_LEGACY_AUTH_ACKNOWLEDGED:-true}
      INTERNAL_JOB_LEGACY_AUTH_EXPIRES_AT: ${INTERNAL_JOB_LEGACY_AUTH_EXPIRES_AT:-2026-12-01T00:00:00.000Z}
      INTERNAL_JOB_REQUIRE_HMAC: ${INTERNAL_JOB_REQUIRE_HMAC:-false}
      INTERNAL_JOB_REQUIRE_TIMESTAMP: ${INTERNAL_JOB_REQUIRE_TIMESTAMP:-}
      INTERNAL_JOB_TIMESTAMP_SKEW_SEC: ${INTERNAL_JOB_TIMESTAMP_SKEW_SEC:-}
      RETENTION_JOB_SECRET: ${RETENTION_JOB_SECRET:-}
      HQ_INSIGHT_JOB_SECRET: ${HQ_INSIGHT_JOB_SECRET:-}
    depends_on:
      postgres-demo:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    networks: [demo]

  admin-web-demo:
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        VITE_ADMIN_SESSION_COOKIES_ONLY: "true"
        VITE_CUSTOMER_SESSION_COOKIES_ONLY: "true"
    restart: unless-stopped
    depends_on:
      api-demo:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-8080}:80"
    networks: [demo]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [demo]
    depends_on:
      - api-demo
      - admin-web-demo
    profiles: [cloudflare]

volumes:
  postgres_demo_data:
    name: pointmor_postgres_demo_data

networks:
  demo:
    name: pointmor_demo
