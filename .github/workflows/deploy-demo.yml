# Debian VM üzerinde Docker Compose demo deploy.
# Sırlar GitHub Secrets içinde tutulur; repo içine yazılmaz.
#
# Tetikleme: main üzerinde CI başarılı olduktan sonra (workflow_run) veya elle (workflow_dispatch).
# Gerekli sırlar: bkz. docs/40-guide-004-demo-deployment.md (GitHub secrets listesi)

name: Deploy demo

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - name: SSH known_hosts (GitHub runner → demo sunucu)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DEMO_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEMO_HOST }}
          username: ${{ secrets.DEMO_USER }}
          key: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            REPO="${{ secrets.DEMO_REPO_PATH }}"
            cd "$REPO"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            chmod +x infra/scripts/*.sh
            ./infra/scripts/deploy-demo.sh
            if [ "${{ vars.DEMO_POST_DEPLOY_SMOKE }}" = "1" ]; then
              ./infra/scripts/smoke-demo.sh
            fi
