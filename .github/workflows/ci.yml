# Minimal CI: lint → Prisma → i18n → build (sırayla, fail-fast)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Gerçek DB yok; Prisma config / generate için geçerli biçimde placeholder
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/pointmor_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma — validate schema & generate client
        run: npm run ci:prisma

      - name: Lint (workspaces)
        run: npm run lint

      - name: API — Vitest
        run: npm run test -w api

      - name: admin-web — i18n validate
        run: npm run ci:i18n

      - name: Build (workspaces)
        run: npm run build
